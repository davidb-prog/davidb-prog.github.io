<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône Petit labo — gabarit de rendu</title>
<!-- Gabarit rendu par tools/build-icons.mjs : la tuile fait 512 px FIXES, ancrée
     en haut à gauche — jamais de tailles en vmin/vh ici, car le « headless » de
     Chromium ampute le viewport de ses bordures de fenêtre (leçon payée : une
     fiole « centrée » sur un viewport plus court que la tuile, donc trop haute
     à l'écran d'accueil). Le script capture large puis rogne à 512 exactement.
     L'illustration reste dans les ~85 % centraux : marge de sécurité pour les
     masques d'icônes (coins arrondis iOS/Android). -->
<style>
  html, body { margin: 0; background: #070b17; }
  .tuile {
    position: absolute; top: 0; left: 0; width: 512px; height: 512px;
    overflow: hidden;
    background-color: #070b17;
    background-image: radial-gradient(369px 369px at 68% 22%, #16204a 0%, #070b17 72%);
  }
  /* centrage OPTIQUE calculé : le dessin occupe les lignes 3,75 → 86,5 de son
     viewBox ; à 522 px de côté, top:18px donne 38 px d'air en haut et 42 en
     bas — la masse de la fiole légèrement assise */
  .tuile svg { position: absolute; top: 18px; left: -5px; width: 522px; height: 522px; }
  .etoile { position: absolute; border-radius: 50%; }
</style>
</head>
<body>
<div class="tuile">
  <span class="etoile" style="width:13px;height:13px;background:#e9edf8;top:61px;left:82px"></span>
  <span class="etoile" style="width:10px;height:10px;background:#9aa5c3;top:123px;right:67px"></span>
  <span class="etoile" style="width:10px;height:10px;background:#46c2a5;bottom:87px;left:61px"></span>
  <span class="etoile" style="width:13px;height:13px;background:#ff6b9d;bottom:123px;right:87px"></span>
  <span class="etoile" style="width:8px;height:8px;background:#a98bff;top:225px;left:46px"></span>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M44 40 L44 54 L30 72 A8 8 0 0 0 37 84 L63 84 A8 8 0 0 0 70 72 L56 54 L56 40 Z"
          fill="#0e1530" stroke="#ffcf5c" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="43" cy="72" r="2.2" fill="#a98bff"/>
    <circle cx="57" cy="70.5" r="2.2" fill="#ff6b9d"/>
    <circle cx="50" cy="77.5" r="1.7" fill="#46c2a5"/>
    <rect x="39.5" y="34" width="21" height="6.5" rx="3.25" fill="#ffcf5c"/>
    <g transform="rotate(10 53 17)">
      <path d="M45.5 13 A7.5 7.5 0 1 1 53 20.5 L53 23"
            fill="none" stroke="#ffcf5c" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="53" cy="29.5" r="2.9" fill="#ffcf5c"/>
    </g>
  </svg>
</div>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône Petit labo — gabarit de rendu</title>
<!-- Gabarit rendu par tools/build-icons.mjs : la fenêtre fait la taille de l'icône
     (512, 192, 180…), tout est en vmin pour que chaque taille sorte identique.
     L'illustration reste dans les ~86 % centraux : marge de sécurité pour les
     masques d'icônes (coins arrondis iOS/Android). -->
<style>
  /* fond sombre sur html ET body : si la capture dépasse la tuile d'un pixel,
     rien de blanc ne peut apparaître */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b17; }
  .tuile {
    position: relative; width: 100vw; height: 100vh;
    background-color: #070b17;
    background-image: radial-gradient(72vmin 72vmin at 68% 22%, #16204a 0%, #070b17 72%);
  }
  .tuile svg {
    position: absolute; top: 50%; left: 50%;
    /* le dessin de la fiole est plus haut que bas dans son viewBox : la taille
       (102vmin) et le décalage (-47vmin) donnent un centrage OPTIQUE — marges
       hautes/basses quasi égales, la masse de la fiole légèrement assise */
    width: 102vmin; height: 102vmin; margin: -47vmin 0 0 -51vmin;
  }
  .etoile { position: absolute; border-radius: 50%; }
</style>
</head>
<body>
<div class="tuile">
  <span class="etoile" style="width:2.6vmin;height:2.6vmin;background:#e9edf8;top:12vmin;left:16vmin"></span>
  <span class="etoile" style="width:2vmin;height:2vmin;background:#9aa5c3;top:24vmin;right:13vmin"></span>
  <span class="etoile" style="width:2vmin;height:2vmin;background:#46c2a5;bottom:17vmin;left:12vmin"></span>
  <span class="etoile" style="width:2.6vmin;height:2.6vmin;background:#ff6b9d;bottom:24vmin;right:17vmin"></span>
  <span class="etoile" style="width:1.6vmin;height:1.6vmin;background:#a98bff;top:44vmin;left:9vmin"></span>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M44 40 L44 54 L30 72 A8 8 0 0 0 37 84 L63 84 A8 8 0 0 0 70 72 L56 54 L56 40 Z"
          fill="#0e1530" stroke="#ffcf5c" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="43" cy="72" r="2.2" fill="#a98bff"/>
    <circle cx="57" cy="70.5" r="2.2" fill="#ff6b9d"/>
    <circle cx="50" cy="77.5" r="1.7" fill="#46c2a5"/>
    <rect x="39.5" y="34" width="21" height="6.5" rx="3.25" fill="#ffcf5c"/>
    <g transform="rotate(10 53 17)">
      <path d="M45.5 13 A7.5 7.5 0 1 1 53 20.5 L53 23"
            fill="none" stroke="#ffcf5c" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="53" cy="29.5" r="2.9" fill="#ffcf5c"/>
    </g>
  </svg>
</div>
</body>
</html>
